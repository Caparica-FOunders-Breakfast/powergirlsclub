<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power Club edit exercises, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9FB}
a{color:#C21C70}a:hover{color:#2B1736}
button,input{font-family:inherit}
input:focus{outline:3px solid #E8308C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 1640px; overflow: hidden; display: flex; flex-direction: column; background: #FBF9FB; color: #2B1736; font-family: Nunito, system-ui, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="flex: none; height: 60px; padding: 0 16px; background: #2B1736; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Bangers, cursive; font-size: 28px; letter-spacing: 1px; color: #FF8AC4">Power Club</span>
    <span style="width: 36px; height: 36px; border-radius: 999px; background: #E8308C; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">KL</span>
  </header>
  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <a href="MobileWeek.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; text-decoration: none; padding: 8px 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>This week</a>
      <h1 style="margin: 0; font-family: Bangers, cursive; font-weight: 400; font-size: 38px; letter-spacing: 1px; line-height: 1">Edit Sunday</h1>
      <p style="margin: 2px 0 0; font-size: 14px; font-weight: 700; color: #5E4E66">Lower body · 5 exercises · saves automatically</p>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 2px solid #2B1736; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: none; width: 26px; height: 26px; border-radius: 999px; background: #2B1736; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{it.num}}</span>
          <label style="flex: 1; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Exercise name</span><input type="text" value="{{it.name}}" style="width: 100%; height: 44px; border: 0; border-bottom: 2px solid #E4DAE7; background: transparent; font-weight: 800; font-size: 17px; color: #2B1736; box-sizing: border-box"></label>
          <button type="button" aria-label="Remove {{it.name}}" style="flex: none; width: 44px; height: 44px; border: 2px solid #E4DAE7; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3165E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F6F1F7">
          <sc-for list="{{it.types}}" as="ty" hint-placeholder-count="4">
            <button type="button" onClick="{{ty.pick}}" aria-pressed="{{ty.pressed}}" style="min-height: 40px; border: 0; border-radius: 9px; background: {{ty.bg}}; color: {{ty.fg}}; font-weight: 800; font-size: 12px; cursor: pointer">{{ty.label}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 800; color: #5E4E66">Sets × {{it.amountLabel}}</span><input type="text" value="3 × {{it.amount}}" style="height: 44px; border: 2px solid #2B1736; border-radius: 12px; padding: 0 10px; font-weight: 800; font-size: 16px; color: #2B1736; box-sizing: border-box"></label>
          <sc-if value="{{it.showLoad}}" hint-placeholder-val="{{true}}">
            <label style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 800; color: #5E4E66">{{it.loadLabel}} (kg)</span><input type="text" value="{{it.load}}" style="height: 44px; border: 2px solid #2B1736; border-radius: 12px; padding: 0 10px; font-weight: 800; font-size: 16px; color: #2B1736; box-sizing: border-box"></label>
          </sc-if>
          <label style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 800; color: #5E4E66">{{it.progLabel}}</span><input type="text" value="{{it.prog}}" style="height: 44px; border: 2px solid #2B1736; border-radius: 12px; padding: 0 10px; font-weight: 800; font-size: 16px; color: #5B21B6; background: #F1E9FE; box-sizing: border-box"></label>
        </div>
        <a href="#video" style="font-weight: 800; font-size: 13px; text-decoration: none; padding: 4px 0">+ Add how-to video</a>
      </div>
    </sc-for>
    <button type="button" style="flex: none; min-height: 52px; border: 2px dashed #C21C70; border-radius: 14px; background: #FFFFFF; color: #C21C70; font-weight: 800; font-size: 15px; cursor: pointer">+ Add exercise</button>
    <a href="MobileWeek.dc.html" style="flex: none; min-height: 52px; display: flex; align-items: center; justify-content: center; background: #C21C70; color: #FFFFFF; border: 2px solid #2B1736; border-radius: 14px; box-shadow: 4px 4px 0 #2B1736; text-decoration: none; font-weight: 800; font-size: 17px">Done</a>
  </main>
  <nav aria-label="App" style="flex: none; height: 72px; background: #FFFFFF; border-top: 2px solid #2B1736; display: flex">
    <a href="MobileWeek.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #C21C70; font-size: 11px; font-weight: 800">
      <span style="width: 44px; height: 30px; border-radius: 999px; background: #FCE4F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></span>This week</a>
    <a href="MobileScorecard.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5E4E66; font-size: 11px; font-weight: 800">
      <span style="width: 44px; height: 30px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Scorecard</a>
    <a href="MobileChallenge.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5E4E66; font-size: 11px; font-weight: 800">
      <span style="width: 44px; height: 30px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.8 3 2.6 3.5 5.2"></path></svg></span>Challenge</a>
    <a href="MobileProfile.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5E4E66; font-size: 11px; font-weight: 800">
      <span style="width: 44px; height: 30px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 1 1 0 8a4 4 0 1 1 0-8M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
  renderVals() {
    const types = (this.state && this.state.types) || { squat: 'Weights', hip: 'Weights', step: 'Weights', knee: 'Body', leg: 'Weights' };
    const CFG = { Weights: { amountLabel: 'reps', amount: '10', showLoad: true, loadLabel: 'Start', progLabel: 'Each week', prog: '+1 kg' },
      Body: { amountLabel: 'reps', amount: '10', showLoad: false, loadLabel: '', progLabel: 'Each week', prog: '+1 rep' },
      Time: { amountLabel: 'sec', amount: '30', showLoad: false, loadLabel: '', progLabel: 'Each week', prog: '+5 sec' },
      Assist: { amountLabel: 'reps', amount: '10', showLoad: true, loadLabel: 'Assist', progLabel: 'Each week', prog: '−1 kg' } };
    const B = [['squat','Barbell squat','45'],['hip','Hip thrust','40'],['step','Step ups','20'],['knee','Hanging knee raises',''],['leg','Leg extension','40']];
    const items = B.map(([id, name, w], i) => { const t = types[id]; const c = CFG[t]; return { num: i + 1, name, ...c, load: t === 'Assist' ? '10' : w,
      types: ['Weights','Body','Time','Assist'].map(l => ({ label: l, pressed: l === t ? 'true' : 'false', bg: l === t ? '#2B1736' : 'transparent', fg: l === t ? '#FFFFFF' : '#2B1736', pick: () => this.setState({ types: { ...types, [id]: l } }) })) }; });
    return { items };
  }
}
</script>
</body>
</html>
