<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power Club edit exercises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9FB}
a{color:#C21C70}a:hover{color:#2B1736}
button,input{font-family:inherit}
input:focus{outline:3px solid #E8308C;outline-offset:1px}
</style>
</helmet>
<div style="width: 100%; min-height: 1400px; background: #FBF9FB; color: #2B1736; font-family: Nunito, system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 40px 24px 64px; box-sizing: border-box">
  <div style="max-width: 760px; margin: 0 auto">

    <!-- Header -->
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div>
        <a href="ThisWeek.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; text-decoration: none; padding: 6px 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to this week</a>
        <h1 style="margin: 6px 0 0; font-family: Bangers, cursive; font-weight: 400; font-size: 48px; letter-spacing: 1px; line-height: 1">Edit Sunday</h1>
        <p style="margin: 6px 0 0; color: #5E4E66; font-weight: 700">Lower body · {{count}} exercises</p>
      </div>
      <p style="margin: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5E4E66">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C21C70" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Changes save automatically</p>
    </div>

    <!-- Exercise cards -->
    <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <div style="background: #FFFFFF; border: 2px solid #2B1736; border-radius: 18px; padding: 18px 20px; box-shadow: 4px 4px 0 #E4DAE7">

          <!-- Name row -->
          <div style="display: flex; align-items: center; gap: 10px">
            <button type="button" aria-label="Reorder {{it.name}}" style="flex: none; width: 36px; height: 44px; border: 0; background: transparent; cursor: grab; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#77677E" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
            </button>
            <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; background: #2B1736; color: #FFFFFF; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">{{it.num}}</span>
            <label style="flex: 1; min-width: 0">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Exercise name</span>
              <input type="text" value="{{it.name}}" style="width: 100%; height: 44px; border: 0; border-bottom: 2px solid #E4DAE7; background: transparent; font-weight: 800; font-size: 19px; color: #2B1736; padding: 0 4px; box-sizing: border-box">
            </label>
            <button type="button" aria-label="Remove {{it.name}}" style="flex: none; width: 44px; height: 44px; border: 2px solid #E4DAE7; border-radius: 12px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3165E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
            </button>
          </div>

          <!-- Type -->
          <div style="margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <span style="font-size: 13px; font-weight: 800; color: #77677E; margin-right: 4px">Type</span>
            <sc-for list="{{it.types}}" as="ty" hint-placeholder-count="4">
              <button type="button" onClick="{{ty.pick}}" aria-pressed="{{ty.pressed}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid {{ty.border}}; background: {{ty.bg}}; color: {{ty.fg}}; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap">{{ty.label}}</button>
            </sc-for>
          </div>

          <!-- Fields -->
          <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-weight: 800; color: #5E4E66">Sets</span>
              <input type="text" inputmode="numeric" value="{{it.sets}}" style="height: 44px; border: 2px solid #2B1736; border-radius: 12px; padding: 0 12px; font-weight: 800; font-size: 16px; color: #2B1736; box-sizing: border-box">
            </label>
            <label style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-weight: 800; color: #5E4E66">{{it.amountLabel}}</span>
              <span style="display: flex; align-items: center; height: 44px; border: 2px solid #2B1736; border-radius: 12px; overflow: hidden">
                <input type="text" inputmode="numeric" value="{{it.amount}}" style="flex: 1; min-width: 0; height: 100%; border: 0; padding: 0 12px; font-weight: 800; font-size: 16px; color: #2B1736">
                <span style="padding: 0 12px; font-size: 14px; font-weight: 700; color: #77677E">{{it.amountUnit}}</span>
              </span>
            </label>
            <sc-if value="{{it.showLoad}}" hint-placeholder-val="{{true}}">
              <label style="display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 13px; font-weight: 800; color: #5E4E66">{{it.loadLabel}}</span>
                <span style="display: flex; align-items: center; height: 44px; border: 2px solid #2B1736; border-radius: 12px; overflow: hidden">
                  <input type="text" inputmode="decimal" value="{{it.load}}" style="flex: 1; min-width: 0; height: 100%; border: 0; padding: 0 12px; font-weight: 800; font-size: 16px; color: #2B1736">
                  <span style="padding: 0 12px; font-size: 14px; font-weight: 700; color: #77677E">kg</span>
                </span>
              </label>
            </sc-if>
            <label style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-weight: 800; color: #5E4E66">{{it.progLabel}}</span>
              <span style="display: flex; align-items: center; height: 44px; border: 2px solid #2B1736; border-radius: 12px; overflow: hidden; background: #F1E9FE">
                <span style="padding: 0 0 0 12px; font-weight: 800; color: #5B21B6">{{it.progSign}}</span>
                <input type="text" inputmode="decimal" value="{{it.prog}}" style="flex: 1; min-width: 0; height: 100%; border: 0; padding: 0 6px; font-weight: 800; font-size: 16px; color: #2B1736; background: transparent">
                <span style="padding: 0 12px; font-size: 14px; font-weight: 700; color: #5B21B6">{{it.progUnit}}</span>
              </span>
            </label>
          </div>

          <!-- Video -->
          <div style="margin-top: 12px">
            <sc-if value="{{it.videoOpen}}" hint-placeholder-val="{{false}}">
              <label style="display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 13px; font-weight: 800; color: #5E4E66">How-to video (YouTube link)</span>
                <input type="url" placeholder="https://youtube.com/watch?v=..." style="height: 44px; border: 2px solid #2B1736; border-radius: 12px; padding: 0 12px; font-size: 15px; color: #2B1736; box-sizing: border-box">
              </label>
            </sc-if>
            <sc-if value="{{it.videoClosed}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{it.openVideo}}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #C21C70; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>Add how-to video</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <button type="button" style="margin-top: 16px; width: 100%; min-height: 56px; border: 2px dashed #C21C70; border-radius: 16px; background: #FFFFFF; color: #C21C70; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add exercise</button>

    <div style="margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #5E4E66; font-weight: 800; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>Reset to default</button>
      <a href="ThisWeek.dc.html" style="min-height: 52px; padding: 0 32px; display: inline-flex; align-items: center; background: #C21C70; color: #FFFFFF; border: 2px solid #2B1736; border-radius: 14px; box-shadow: 4px 4px 0 #2B1736; text-decoration: none; font-weight: 800; font-size: 17px">Done</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const types = st.types || { squat: 'Weights', hip: 'Weights', step: 'Weights', knee: 'Bodyweight', leg: 'Weights' };
    const video = st.video || {};
    const BASE = [
      { id: 'squat', name: 'Barbell squat', w: '45' },
      { id: 'hip', name: 'Hip thrust', w: '40' },
      { id: 'step', name: 'Step ups', w: '20' },
      { id: 'knee', name: 'Hanging knee raises', w: '' },
      { id: 'leg', name: 'Leg extension', w: '40' }
    ];
    const CFG = {
      'Weights':    { amountLabel: 'Reps', amount: '10', amountUnit: 'reps', showLoad: true,  loadLabel: 'Starting weight', progLabel: 'Add each week', progSign: '+', prog: '1', progUnit: 'kg' },
      'Bodyweight': { amountLabel: 'Reps', amount: '10', amountUnit: 'reps', showLoad: false, loadLabel: '', progLabel: 'Add each week', progSign: '+', prog: '1', progUnit: 'reps' },
      'Time':       { amountLabel: 'Hold for', amount: '30', amountUnit: 'sec', showLoad: false, loadLabel: '', progLabel: 'Add each week', progSign: '+', prog: '5', progUnit: 'sec' },
      'Assisted':   { amountLabel: 'Reps', amount: '10', amountUnit: 'reps', showLoad: true,  loadLabel: 'Assistance', progLabel: 'Less help each week', progSign: '−', prog: '1', progUnit: 'kg' }
    };
    const items = BASE.map((b, i) => {
      const t = types[b.id];
      const c = CFG[t];
      return {
        num: i + 1, name: b.name, sets: '3', ...c,
        load: t === 'Assisted' ? '10' : b.w,
        videoOpen: !!video[b.id], videoClosed: !video[b.id],
        openVideo: () => this.setState({ video: { ...video, [b.id]: true } }),
        types: ['Weights', 'Bodyweight', 'Time', 'Assisted'].map(l => {
          const on = l === t;
          return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#2B1736' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2B1736', border: on ? '#2B1736' : '#E4DAE7',
            pick: () => this.setState({ types: { ...types, [b.id]: l } }) };
        })
      };
    });
    return { items, count: items.length };
  }
}
</script>
</body>
</html>
